name: Build verified gcsim engine packages
on:
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Upstream gcsim commit or branch
        required: true
        default: master
      publish:
        description: Publish verified packages as a separate prerelease
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  packages:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: Tools/GcsimBridge/go.sum
      - name: Build with upstream and regression checks
        shell: pwsh
        env:
          GCSIM_REF: ${{ inputs.engine_ref }}
        run: ./Tools/GcsimBridge/Build-Packages.ps1 -EngineRef $env:GCSIM_REF
      - uses: actions/upload-artifact@v4
        with:
          name: gcsim-engine-packages
          path: Tools/GcsimBridge/bin/packages/*.zip
      - name: Publish explicitly requested engine prerelease
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_TAG: gcsim-engine-${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: gh release create $env:PACKAGE_TAG Tools/GcsimBridge/bin/packages/*.zip --target $env:SOURCE_COMMIT --prerelease --title $env:PACKAGE_TAG --notes 'Verified gcsim engine packages. Install explicitly from the optimizer; personal Builds and prior engine versions are preserved.'
